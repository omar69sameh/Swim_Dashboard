name: imu_reader
description: IMU sensor monitoring app with data export

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sensors_plus: ^6.0.1
  path_provider: ^2.1.2
  supabase_flutter: ^2.0.0    # Supabase: auth + database
  uuid: ^3.0.0                # Generate unique IDs for sessions
  device_info_plus: ^10.1.0   # Get device information

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true